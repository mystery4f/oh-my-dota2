<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>训练管理</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 16px;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: 13px;
        background: #16181d;
        color: #d7dae0;
      }
      h1 { font-size: 15px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
      label { color: #9aa0a8; }
      select, input, button {
        background: #22252b;
        color: #d7dae0;
        border: 1px solid #3a3f47;
        border-radius: 4px;
        padding: 5px 9px;
        font-size: 13px;
      }
      button { cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary { background: #2f6fdb; border-color: #2f6fdb; color: #fff; }
      .bar { height: 10px; background: #22252b; border-radius: 5px; overflow: hidden; margin: 6px 0 10px; }
      .bar > div { height: 100%; width: 0; background: #2f6fdb; transition: width 0.3s; }
      .status { min-height: 18px; margin-bottom: 8px; color: #9aa0a8; }
      .status b { color: #d7dae0; }
      .error { color: #e06c75; }
      .ft-head { margin: 14px 0 6px; font-size: 14px; color: #d7dae0; }
      .lines { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
      .chip {
        border: 1px solid #3a3f47; border-radius: 4px; padding: 3px 7px;
        font-size: 12px; color: #9aa0a8; background: #1c1f24; cursor: pointer;
      }
      .chip.done { color: #98c379; border-color: #2e4a33; }
      .chip.current { color: #fff; border-color: #2f6fdb; background: #24406e; }
      .text {
        font-size: 22px; line-height: 1.5; min-height: 64px; padding: 10px;
        background: #101216; border: 1px solid #2a2e35; border-radius: 4px; margin-bottom: 8px;
      }
      .hint { color: #9aa0a8; }
      pre {
        background: #101216;
        border: 1px solid #2a2e35;
        border-radius: 4px;
        padding: 8px;
        height: 260px;
        overflow-y: auto;
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <!-- 训练窗口页：填任务、开/停、看进度和日志。决策在 @shared/train，进程在主进程 manager。 -->
    <h1>训练管理</h1>
    <div class="row">
      <label for="kind">任务</label>
      <select id="kind">
        <option value="demo">演示任务（哑命令，验证生命周期）</option>
        <option value="gv-gpt">GV 微调 · GPT 权重（T3 接入）</option>
        <option value="gv-sovits">GV 微调 · SoVITS 权重（T3 接入）</option>
        <option value="asr-ft">ASR 口音微调（T5 接入）</option>
      </select>
      <label for="dataset">数据集</label>
      <input id="dataset" type="text" placeholder="数据集名（T3 起是登记名）" style="width: 220px" />
      <button id="start" class="primary">开始训练</button>
      <button id="stop">停止</button>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="status" id="status">没有任务</div>
    <pre id="log"></pre>
    <script type="module" src="./train.ts"></script>
    <!-- ASR 微调录音（T4a）：内置读稿逐句录，录音落 userData/asr-ft/。 -->
    <div class="ft-head">ASR 口音微调 · 录音</div>
    <div class="error" id="ftError"></div>
    <div class="row">
      <label for="ftGroup">录音组</label>
      <select id="ftGroup"></select>
      <span class="hint" id="ftGroupInfo"></span>
    </div>
    <div class="lines" id="ftLines"></div>
    <div class="text" id="ftText"></div>
    <div class="row">
      <button id="ftRec" class="primary">录制（空格）</button>
      <button id="ftStopRec" disabled>停</button>
      <button id="ftReplay" disabled>回放</button>
      <button id="ftAsr" disabled>识别测试</button>
      <button id="ftPack">打包训练数据</button>
      <button id="startFt" class="primary">微调并替换模型</button>
      <span class="hint" id="ftHint">点录制后念屏幕上的句子，停顿约 1 秒自动停</span>
    </div>
    <div class="hint" id="ftAsrResult"></div>
    <div class="row" style="margin-top: 12px">
      <span class="hint" id="ftEnv">微调环境：检测中…</span>
      <button id="ftApply" disabled>应用新模型</button>
      <button id="ftRollback" disabled>回滚上一版</button>
    </div>
  </body>
</html>
