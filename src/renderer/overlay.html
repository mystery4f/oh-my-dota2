<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>聊天浮层</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        user-select: none;
      }
      #root {
        box-sizing: border-box;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 10px 12px;
        border: 1px solid rgba(251, 191, 36, 0.28);
        border-radius: 12px;
        background: transparent;
      }
      #pill {
        align-self: flex-end;
        font-size: 12px;
        line-height: 1;
        padding: 6px 11px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      }
      #pill.through {
        color: #fbbf24;
        border-color: rgba(251, 191, 36, 0.5);
      }
      #list {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
        overflow: hidden;
        margin-top: 8px;
      }
      .row {
        background: rgba(12, 10, 9, var(--row-alpha, 0.34));
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 8px;
        padding: 6px 10px;
        position: relative;
      }
      /* 头像钉在行首，文字让出位置；没头像的行不留空。 */
      .row.has-hero {
        padding-left: 42px;
        min-height: 40px;
      }
      .row.has-hero .hero-img {
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .row.hint {
        border: 1px dashed rgba(251, 191, 36, 0.55);
        color: #fbbf24;
        font-size: 12px;
      }
      .orig {
        color: #e7e5e4;
        font-size: 13px;
        line-height: 1.35;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      .trans {
        color: #fbbf24;
        font-size: 13px;
        line-height: 1.35;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        margin-top: 2px;
      }
      /* 词库直接给的结果标一个「词」，和现翻的亮黄区分开。 */
      .trans.cached::before {
        content: '词';
        display: inline-block;
        margin-right: 4px;
        padding: 0 3px;
        border-radius: 3px;
        background: rgba(251, 191, 36, 0.18);
        color: #fcd34d;
        font-size: 10px;
        line-height: 1.5;
        vertical-align: 1px;
      }
      .trans.cached {
        color: #fde68a;
      }
      /* 翻失败的行：红字 + ✕，和「还在翻」的黄点状省略号一眼就能分开。 */
      .trans.err {
        color: #f87171;
      }
      .reply {
        margin-top: 8px;
        padding: 8px;
        border: 1px solid rgba(251, 191, 36, 0.5);
        border-radius: 8px;
        background: rgba(12, 10, 9, 0.94);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      }
      .reply.hidden {
        display: none;
      }
      #reply-input {
        box-sizing: border-box;
        width: 100%;
        height: 56px;
        resize: none;
        border: 0;
        outline: none;
        background: transparent;
        color: #e7e5e4;
        font-family: 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }
      #reply-hint {
        font-size: 11px;
        color: #a8a29e;
        margin-top: 4px;
      }
      #reply-hint.err {
        color: #f87171;
      }
      .row.sent .trans {
        color: #86efac;
      }
      /* 译文未到：原文先出现，压暗一点表示仍在翻译 */
      .row.pending .orig {
        color: rgba(255, 255, 255, 0.72);
      }
      /* 显示层次：translated = 只留译文（原文只在译文未到时占位），original = 只留原文 */
      body[data-text='translated'] .row:not(.sent):has(.trans) .orig {
        display: none;
      }
      body[data-text='original'] .trans {
        display: none;
      }
      .row.pending .orig::after {
        content: ' · 翻译中…';
        font-size: 11px;
        color: rgba(251, 191, 36, 0.75);
      }

      /* ── 锁定 / 拖动 / 缩放 ─────────────────────────────────────────── */
      /* 工具条只在解锁时出现：锁定时它是一个纯粹的画面，连边框都不抢眼。 */
      #bar {
        display: none;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        padding: 4px 6px;
        border-radius: 8px;
        background: rgba(37, 99, 235, 0.25);
        border: 1px solid rgba(96, 165, 250, 0.55);
        cursor: grab;
        font-size: 11px;
        color: rgba(219, 234, 254, 0.95);
      }
      #bar:active {
        cursor: grabbing;
      }
      body[data-locked='false'] #bar {
        display: flex;
      }
      body[data-locked='false'] #root {
        border-color: rgba(96, 165, 250, 0.8);
        box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.25);
      }
      /* 新消息亮一下：不盯屏幕也知道来了字。 */
      .row.fresh {
        animation: fresh-in 0.4s ease-out;
      }
      @keyframes fresh-in {
        from {
          background: rgba(253, 224, 71, 0.22);
        }
        to {
          background: transparent;
        }
      }
      /* 超过 FADE_AFTER 行的旧消息渐隐，保留上下文但不占视野。 */
      .row.old {
        opacity: 0.55;
      }
      /* 异常提示（没进对局 / 没选区域 / 捕获停了）：淡橙，不用红色吓人。 */
      #pill.warn {
        color: rgba(253, 230, 138, 0.95);
        border-color: rgba(251, 191, 36, 0.45);
      }
      #bar-label {
        flex: 1;
        user-select: none;
      }
      #bar button {
        padding: 2px 8px;
        border-radius: 6px;
        border: 1px solid rgba(147, 197, 253, 0.5);
        background: rgba(15, 23, 42, 0.55);
        color: rgba(219, 234, 254, 0.95);
        font: inherit;
        cursor: pointer;
      }
      #bar button:hover {
        background: rgba(37, 99, 235, 0.55);
      }
      /* 收起后的小图标：整窗只剩它，点一下展开。 */
      #mini {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.6);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.72);
        color: rgba(219, 234, 254, 0.95);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      /* 未锁定时小图标可以拖走：给个拖动手势；锁定时反正穿透，手势无所谓。 */
      body[data-locked='false'] #mini {
        cursor: move;
      }
      #mini:hover {
        background: rgba(37, 99, 235, 0.6);
      }
      body[data-collapsed='true'] #mini {
        display: flex;
      }
      body[data-collapsed='true'] #bar,
      body[data-collapsed='true'] #list,
      body[data-collapsed='true'] #pill,
      body[data-collapsed='true'] .rz {
        display: none;
      }
      body[data-collapsed='true'] #root {
        padding: 0;
        border-color: transparent;
      }
      .rz {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 10px;
        display: none;
        cursor: ew-resize;
      }
      #resize-left {
        left: 0;
      }
      #resize-right {
        right: 0;
      }
      body[data-locked='false'] .rz {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="pill">运行中 · Alt+Shift+O</div>
      <!-- 未锁定时出现：拖这里搬位置，双击切锁定；两侧把手拉宽度 -->
      <button id="mini" type="button">🔊 翻译区</button>
      <div id="bar">
        <span id="bar-label">未锁定 · 可拖动</span>
        <button id="bar-reset" type="button">还原</button>
        <button id="bar-voice" type="button">朗读：开</button>
        <button id="bar-collapse" type="button">收起</button>
        <button id="bar-lock" type="button">锁定</button>
      </div>
      <div id="resize-left" class="rz"></div>
      <div id="resize-right" class="rz"></div>
      <div id="list">
        <div id="hint" class="row hint">等待聊天捕获 · 选区域并开始捕获后，双语消息会浮在这里</div>
      </div>
      <div id="reply" class="reply hidden">
        <textarea id="reply-input" placeholder="中文回车 → 英文进剪贴板"></textarea>
        <div id="reply-hint">Enter 发送 · Shift+Enter 换行 · Esc 关闭</div>
      </div>
    </div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
