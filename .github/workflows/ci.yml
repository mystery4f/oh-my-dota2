name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The app is Windows-only (PowerShell bridges, SendInput, PaddleOCR natives),
    # so it is checked on the platform it ships on rather than on Linux.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Guard against leaked API keys
        run: npm run guard

      - name: Build
        run: npm run build

  probes:
    # The pure seams only: no window, no network, no game, no model. These are exactly the
    # behaviours a shared-logic refactor breaks, and until now CI never ran a single probe.
    # A probe exits non-zero when a check fails, so the step is the gate — no parsing needed.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pure probes
        shell: bash
        run: |
          set -euo pipefail
          # 清单问应用自己（registry 里标了 `ci: true` 的那几条）：以前这里手抄 9 行，
          # 和 docs/PROBES.md 一样会跟真表漂移，漏掉的探针就再也没人跑过。
          npx electron out/main/index.js --probes-ci | grep '^--' > "$RUNNER_TEMP/probes.txt"
          echo "CI 要跑 $(wc -l < "$RUNNER_TEMP/probes.txt") 条探针"
          while read -r flag; do
            echo "== $flag"
            npx electron out/main/index.js "$flag"
          done < "$RUNNER_TEMP/probes.txt"
